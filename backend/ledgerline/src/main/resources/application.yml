server:
  port: ${PORT:8080}

spring:
  application:
    name: ledgerline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
    username: ${DB_USER:ledgerline_app}
    password: ${DB_PASSWORD:ledgerline_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ledgerline:
  jwt:
    secret: ${JWT_SECRET:ledgerline_super_secure_jwt_secret_key_minimum_256_bits_length_123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator & Swagger UI
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
