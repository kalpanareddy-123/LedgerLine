spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
    username: ${TEST_DB_USER:ledgerline_app}
    password: ${TEST_DB_PASSWORD:ledgerline_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

ledgerline:
  jwt:
    secret: test_super_secure_jwt_secret_key_minimum_256_bits_length_123456
    expiration-ms: 3600000
